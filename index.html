<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurdistan Volumetric Weather Simulation</title>
    <meta name="description" content="Live 3D Kurdistan & Northern Iraq terrain with real high-resolution satellite imagery, digital elevation model, and real-time live Open-Meteo weather telemetry." />
    <meta property="og:title" content="Kurdistan Volumetric Weather Simulation" />
    <meta property="og:description" content="Live 3D Kurdistan & Northern Iraq terrain with real high-resolution satellite imagery, digital elevation model, and real-time live Open-Meteo weather telemetry." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B0E14] text-slate-100 overflow-hidden select-none">
    <div id="root"></div>
    <!--
      CesiumJS resolves its Workers / Assets / Widgets against window.CESIUM_BASE_URL.
      It must be set BEFORE the app bundle loads, and it is resolved against the document so
      it works both at "/" in dev and under the GitHub Pages subpath in production.
    -->
    <script>
      window.CESIUM_BASE_URL = new URL('cesium/', document.baseURI).href;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
